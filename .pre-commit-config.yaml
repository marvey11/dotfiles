# .pre-commit-config.yaml
repos:
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        # Force matching on all .sh files and hidden bash dotfiles
        # Make sure to find `.bashrc` in the subdirectory `bash/`
        files: ^.*(\.sh|\.bashrc)$
        types: [file] # Override default type filters
